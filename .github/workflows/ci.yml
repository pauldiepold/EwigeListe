name: CI

on:
  pull_request:
    branches:
      - master
      - inertia-migration
  push:
    branches:
      - inertia-migration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Tests, Build, Type-Check, Lint, Format
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pint --test

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test --compact

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (erzeugt Wayfinder-Routen sowie auto-imports.d.ts und components.d.ts)
        run: npm run build

      - run: npm run type-check
      - run: npm run lint
      - run: npm run format
