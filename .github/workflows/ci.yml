name: CI

on:
  pull_request:
    branches:
      - master
      - inertia-migration
  push:
    branches:
      - inertia-migration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test --compact

  frontend:
    name: Build, Type-Check, Lint, Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build (erzeugt auch auto-imports.d.ts und components.d.ts)
        run: npm run build

      - run: npm run type-check
      - run: npm run lint
      - run: npm run format
