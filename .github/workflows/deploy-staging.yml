name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      sync_db:
        description: 'DB von Prod-Dump einspielen?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
  push:
    branches:
      - inertia-migration

# Nie zwei Deploys gleichzeitig: ein neuer wartet, bis der laufende fertig ist.
# Laufende Deploys werden nicht abgebrochen (sonst bleibt Staging im Wartungsmodus).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04

    # Direkt per OpenSSH des Runners statt `appleboy/ssh-action`: Die Action lädt bei jedem Lauf
    # ein Binary von GitHub-Releases nach, und dieser Download scheiterte wiederholt mit 504.
    steps:
      - name: SSH-Schlüssel einrichten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'DEPLOY'
            set -e

            cd ${{ secrets.STAGING_PATH }}

            echo "=== Git: Branch auschecken ==="
            eval $(ssh-agent -s)
            ssh-add ${{ secrets.BASE_PATH }}/.ssh/id_ed25519
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Zwischengespeicherte Provider- und Config-Listen des alten Stands verweisen auf gelöschte Klassen;
            # schon `artisan down` würde daran scheitern.
            echo "=== Bootstrap-Cache leeren ==="
            rm -f bootstrap/cache/*.php

            # Vor `artisan down`: Die Config des neuen Stands kann Klassen neuer Pakete brauchen
            # (z. B. `Laravel\Fortify\Features` in `config/fortify.php`).
            echo "=== Composer Install ==="
            composer install --optimize-autoloader

            echo "=== Maintenance ON ==="
            php artisan down

            # Wayfinder liest beim Build die Routen; ein alter Cache würde neue Routen verschweigen.
            echo "=== Caches leeren ==="
            php artisan route:clear
            php artisan config:clear

            echo "=== NPM Build ==="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm ci
            npm run prod

            # Beim Push gibt es keine Inputs: dann immer mit frischem Prod-Dump.
            if [ "${{ github.event.inputs.sync_db || 'yes' }}" = "yes" ]; then
              echo "=== DB Sync: neuesten Dump suchen ==="
              LATEST_DUMP=$(ls -t ${{ secrets.BACKUP_DUMP_PATH }}/*.sql.gz | head -1)
              echo "Verwende Dump: $LATEST_DUMP"

              echo "=== DB einspielen ==="
              gunzip < "$LATEST_DUMP" | mysql \
                -u ${{ secrets.STAGING_DB_USER }} \
                -p${{ secrets.STAGING_DB_PASSWORD }} \
                ${{ secrets.STAGING_DB_NAME }}
            else
              echo "=== DB Sync übersprungen ==="
            fi

            echo "=== Migrations ==="
            php artisan migrate --force

            echo "=== Cache ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Maintenance OFF ==="
            php artisan up

            # Der Prod-Dump kennt die Listenstatistik noch nicht in den neuen Spalten.
            if [ "${{ github.event.inputs.sync_db || 'yes' }}" = "yes" ]; then
              echo "=== Statistiken neu berechnen ==="
              php artisan stats:recalculate
            fi
          DEPLOY
